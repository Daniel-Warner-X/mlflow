name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
      - add-experiment-tool-registry
  workflow_dispatch:  # Allows manual triggering from Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'yarn'
          cache-dependency-path: mlflow/server/js/yarn.lock

      - name: Install dependencies
        working-directory: mlflow/server/js
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: mlflow/server/js
        run: yarn build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare deployment
        run: |
          mkdir -p _site
          cp -r mlflow/server/js/build/* _site/
          # Create root redirect to tools page
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>MLflow Tool Registry Demo</title>
            <meta http-equiv="refresh" content="0; url=/mlflow/static-files/index.html#/tools">
          </head>
          <body>
            <p>Redirecting to MLflow Tool Registry...</p>
            <p>If not redirected, <a href="/mlflow/static-files/index.html#/tools">click here</a>.</p>
          </body>
          </html>
          EOF
          # Create 404.html for SPA routing (GitHub Pages uses this for 404s)
          cat > _site/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>MLflow Tool Registry Demo</title>
            <meta http-equiv="refresh" content="0; url=/mlflow/static-files/index.html#/tools">
          </head>
          <body>
            <p>Redirecting to MLflow Tool Registry...</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
