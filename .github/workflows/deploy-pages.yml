name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
      - add-experiment-tool-registry
  workflow_dispatch:  # Allows manual triggering from Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'yarn'
          cache-dependency-path: mlflow/server/js/yarn.lock

      - name: Install dependencies
        working-directory: mlflow/server/js
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: mlflow/server/js
        run: yarn build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare deployment
        run: |
          mkdir -p _site/static-files
          # Copy the index.html to root
          cp mlflow/server/js/build/index.html _site/
          # Copy all build assets to static-files/ to match the publicPath
          cp -r mlflow/server/js/build/static _site/static-files/
          # Copy other assets if they exist
          if [ -d mlflow/server/js/build/lib ]; then
            cp -r mlflow/server/js/build/lib _site/static-files/
          fi
          # Copy favicon and manifest
          if [ -f mlflow/server/js/build/favicon.ico ]; then
            cp mlflow/server/js/build/favicon.ico _site/static-files/
          fi
          if [ -f mlflow/server/js/build/manifest.json ]; then
            cp mlflow/server/js/build/manifest.json _site/static-files/
          fi
          # Add redirect script to index.html using echo and temp file
          cat _site/index.html | sed 's|</body>|<script>if(window.location.hash===""||window.location.hash==="#/"){window.location.hash="#/tools";}</script></body>|' > _site/index-new.html
          mv _site/index-new.html _site/index.html
          # Create 404.html for SPA routing
          cp _site/index.html _site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
